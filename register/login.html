<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login/Signup Form</title>
  <link rel="stylesheet" href="loginStyle.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>
<body>

  <div class="container" id="container">
    <!-- Login Form -->
    <div class="form-container sign-in-container">
      <form id="loginForm">
        <h2>Login</h2>
        <div class="input-box">
          <input type="text" id="loginUsername" placeholder="Username" required />
          <i class='bx bx-user'></i>
        </div>
        <div class="input-box">
          <input type="password" id="loginPassword" placeholder="Password" required />
          <i class='bx bx-lock-alt'></i>
        </div>
        <div class="forgot-link">
          <a href="#">Forgot Password?</a>
        </div>
        <button type="submit">Login</button>
        <div id="loginMessage" class="message"></div>
      </form>
    </div>

    <!-- Register Form -->
    <div class="form-container sign-up-container">
      <form id="registerForm">
        <h2>Register</h2>
        <div class="input-box">
          <input type="text" id="regUsername" placeholder="Username" required />
          <i class='bx bx-user'></i>
        </div>
        <div class="input-box">
          <input type="email" id="regEmail" placeholder="Email" required />
          <i class='bx bx-envelope'></i>
        </div>
        <div class="input-box">
          <input type="password" id="regPassword" placeholder="Password" required />
          <i class='bx bx-lock-alt'></i>
        </div>
        <button type="submit">Register</button>
        <div id="regMessage" class="message"></div>
      </form>
    </div>

    <!-- Sliding Panel -->
    <div class="overlay-container">
      <div class="overlay">
        <div class="overlay-panel overlay-left">
          <h2>Welcome Back!</h2>
          <p>To keep connected, please login with your details</p>
          <button class="ghost" id="signIn" type="button">Login</button>
        </div>
        <div class="overlay-panel overlay-right">
          <h2>Hello, Friend!</h2>
          <p>Enter your details to start your journey with us</p>
          <button class="ghost" id="signUp" type="button">Register</button>
        </div>
      </div>
    </div>
  </div>

  <script src="loginLogic.js"></script>
</body>
</html>
